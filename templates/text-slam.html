<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <style>
    :root {
      --bg: transparent;
      --text-color: #F8FAFC;
      --highlight-color: #C92A2A;
      --font-family: 'Inter', sans-serif;
      --font-size: 76px;
      --font-weight: 800;
      --letter-spacing: -0.02em;
      --shake-intensity: 6px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg);
      font-family: var(--font-family);
    }
    #root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5%;
    }
    .slam-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px 28px;
      max-width: 1500px;
      text-align: center;
    }
    .word {
      display: inline-block;
      font-size: var(--font-size);
      font-weight: var(--font-weight);
      color: var(--text-color);
      letter-spacing: var(--letter-spacing);
      text-shadow: var(--shadow);
      opacity: 0;
      transform-origin: center center;
    }
    .word.highlight {
      color: var(--highlight-color);
    }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
    <div id="slam-box" class="clip" data-start="0" data-duration="3" data-track-index="0">
      <div class="slam-container" id="words-container">
        <!-- Rendered words injected dynamically -->
        <span class="word" id="w-0">Running</span>
        <span class="word" id="w-1">a</span>
        <span class="word" id="w-2">business</span>
        <span class="word" id="w-3">is</span>
        <span class="word" id="w-4">already</span>
        <span class="word highlight" id="w-5">hard</span>
        <span class="word highlight" id="w-6">enough.</span>
      </div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const words = document.querySelectorAll('.word');
    const step = 0.18;

    words.forEach((w, i) => {
      const startTime = i * step;
      tl.fromTo(w,
        { opacity: 0, scale: 2.4, y: -40, filter: "blur(12px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power4.out" },
        startTime
      );
      // Subtle camera shake on slam
      tl.fromTo("#slam-box",
        { y: -5, x: (i % 2 === 0 ? 4 : -4) },
        { y: 0, x: 0, duration: 0.15, ease: "power2.out" },
        startTime + 0.05
      );
    });

    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
